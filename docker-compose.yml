services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: tooldoctor
      POSTGRES_USER: tooldoctor
      POSTGRES_PASSWORD: tooldoctor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tooldoctor -d tooldoctor"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://tooldoctor:tooldoctor@postgres:5432/tooldoctor
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: http://localhost:3000
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-86400}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env to enable authentication}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Tool Doctor Admin}
      ADMIN_MOBILE: ${ADMIN_MOBILE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:5000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "5000:5000"

  monitor:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "monitor.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://tooldoctor:tooldoctor@postgres:5432/tooldoctor
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-86400}
      MONITOR_POLL_SECONDS: ${MONITOR_POLL_SECONDS:-60}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/graphql
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
